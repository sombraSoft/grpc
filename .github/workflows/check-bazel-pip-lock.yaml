name: Check requirements.bazel.lock

# Re-runs the documented pip-compile invocation and fails if
# requirements.bazel.lock drifts from requirements.bazel.txt. The actual
# check lives in tools/run_tests/sanity/check_bazel_pip_lock.py so that it
# can also be invoked from other CI drivers or locally.

on:
  pull_request:
    branches:
      - master
    paths:
      - 'requirements.bazel.txt'
      - 'requirements.bazel.lock'
      - 'tools/run_tests/sanity/check_bazel_pip_lock.py'
      - '.github/workflows/check-bazel-pip-lock.yaml'

jobs:
  check-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Check requirements.bazel.lock is hash-pinned and in sync
        run: python3 tools/run_tests/sanity/check_bazel_pip_lock.py
